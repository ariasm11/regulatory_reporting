name: SITER controls
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m siter.run --data data/sample --period 202608 --out output
      - run: node --check web/workspace.js && node --check web/app.js
