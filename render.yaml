# Deploying this blueprint provisions PAID compute + a persistent disk.
# The repository alone does not create or charge for any service.
services:
  - type: web
    name: siter-reporting
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    disk:
      name: siter-private-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SITER_STATE_DIR
        value: /var/data/siter
      - key: SITER_BOOTSTRAP_USER
        sync: false
      - key: SITER_BOOTSTRAP_PASSWORD
        sync: false
